<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h2>Register Page</h2>

    <form action="/register_user" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Name"
            required>

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <br><br>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/">
        Back To Login
    </a>

</body>
</html>
