<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Welcome {{ name }}</h1>

    <h3>Open Tasks: {{ open_tasks }}</h3>

    <h2>Todo Dashboard</h2>

    <form action="/add_todo" method="POST">

        <input
            type="text"
            name="title"
            placeholder="New Task"
            required>

        <button type="submit">
            Add Task
        </button>

    </form>

    <hr>

    {% if not todos %}
        <p>No tasks yet.</p>
    {% endif %}

    {% for todo in todos %}

    <p>

        {% if todo.is_done %}
            ✅
        {% else %}
            ❌
        {% endif %}

        <form action="/edit_todo/{{ todo.todo_id }}"
              method="POST"
              style="display:inline;">

            <input
                type="text"
                name="title"
                value="{{ todo.title }}">

            <button type="submit">
                Save
            </button>

        </form>

        <a href="/toggle_done/{{ todo.todo_id }}">
            Done
        </a>

        |

        <a href="/delete_todo/{{ todo.todo_id }}"
           onclick="return confirm('Are you sure?')">
            Delete
        </a>

    </p>

    {% endfor %}

    <br>

    <a href="/logout">
        Logout
    </a>

</body>
</html>
